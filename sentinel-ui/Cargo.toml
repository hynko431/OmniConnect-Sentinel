[package]
name = "sentinel-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Native GPU-rendered Cyber Defense Station & Air-Gapped Kiosk UI for OmniConnect Sentinel built with the Rune Framework (anomalyco/rune)"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5", features = ["tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Required upstream patches from anomalyco/rune (Cargo does not inherit [patch] from dependencies).
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }
winit = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
