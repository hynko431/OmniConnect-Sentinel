[workspace]
members = [
    "crates/sentinel-proto",
    "crates/sentinel-sys",
    "crates/sentinel-cdr",
    "crates/sentinel-core",
    "crates/sentinel-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["OmniConnect Sentinel Team <security@omniconnect.dev>"]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/omniconnect/sentinel"

[workspace.dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"

# gRPC & Protocol Buffers
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Hashing & Cryptography
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.21.7"
crc32fast = "1.5.2"

# Observability & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OS-Level System Bindings
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

# Internal workspace crates
sentinel-proto = { path = "crates/sentinel-proto" }
sentinel-sys = { path = "crates/sentinel-sys" }
sentinel-cdr = { path = "crates/sentinel-cdr" }
sentinel-core = { path = "crates/sentinel-core" }
