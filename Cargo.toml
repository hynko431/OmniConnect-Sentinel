[workspace]
members = [
    "crates/sentinel-proto",
    "crates/sentinel-sys",
    "crates/sentinel-cdr",
    "crates/sentinel-core",
    "crates/sentinel-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["OmniConnect Sentinel Team <security@omniconnect.dev>"]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/omniconnect/sentinel"

[workspace.dependencies]
# Async Runtime & Concurrency
tokio = { version = "=1.53.3", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"

# gRPC & Protocol Buffers
tonic = { version = "0.13.1", default-features = false, features = ["codegen", "prost"] }
prost = "0.13.5"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Hashing & Cryptography
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "arithmetic", "pkcs8"] }
hkdf = "0.12"
hmac = "0.12"
subtle = "2.6"
rsa = { version = "0.10", default-features = false, features = ["std"] }

# Observability & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OS-Level System Bindings
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

# TLS & Networking
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.10", features = ["std"] }
webpki-roots = "0.26"
url = "2.5"

# Internal workspace crates
sentinel-proto = { version = "0.1.0", path = "crates/sentinel-proto" }
sentinel-sys = { version = "0.1.0", path = "crates/sentinel-sys" }
sentinel-cdr = { version = "0.1.0", path = "crates/sentinel-cdr" }
sentinel-core = { version = "0.1.0", path = "crates/sentinel-core" }

