[workspace]
members = [
    "crates/sentinel-proto",
    "crates/sentinel-sys",
    "crates/sentinel-cdr",
    "crates/sentinel-core",
    "crates/sentinel-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["OmniConnect Sentinel Team <security@omniconnect.dev>"]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/omniconnect/sentinel"

[workspace.dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"

# gRPC & Protocol Buffers
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Hashing & Cryptography
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"

# Observability & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OS-Level System Bindings
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

# Internal workspace crates
sentinel-proto = { version = "0.1.0", path = "crates/sentinel-proto" }
sentinel-sys = { version = "0.1.0", path = "crates/sentinel-sys" }
sentinel-cdr = { version = "0.1.0", path = "crates/sentinel-cdr" }
sentinel-core = { version = "0.1.0", path = "crates/sentinel-core" }

[workspace.lints.rust]
unknown_lints = "allow"
renamed_and_removed_lints = "allow"
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused_mut = "allow"

[workspace.lints.clippy]
chunks_exact_to_as_chunks = "allow"
while_let_loop = "allow"
useless_borrows_in_formatting = "allow"
manual_pattern_char_comparison = "allow"
question_mark = "allow"
permissions_set_readonly_false = "allow"
io_other_error = "allow"
manual_c_str_literals = "allow"
doc_lazy_continuation = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
needless_return = "allow"
needless_borrows_for_generic_args = "allow"
manual_range_contains = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
ptr_arg = "allow"
len_without_is_empty = "allow"
new_without_default = "allow"
redundant_closure = "allow"
manual_strip = "allow"
if_same_then_else = "allow"
derivable_impls = "allow"
should_implement_trait = "allow"
single_match = "allow"
match_like_matches_macro = "allow"
redundant_field_names = "allow"
let_and_return = "allow"
unnecessary_cast = "allow"
upper_case_acronyms = "allow"
enum_variant_names = "allow"
vec_init_then_push = "allow"
useless_vec = "allow"
assertions_on_constants = "allow"
field_reassign_with_default = "allow"
manual_flatten = "allow"
while_let_on_iterator = "allow"
explicit_counter_loop = "allow"
for_kv_map = "allow"
needless_question_mark = "allow"
map_clone = "allow"
clone_on_copy = "allow"
redundant_pattern_matching = "allow"
manual_is_multiple_of = "allow"
empty_line_after_doc_comments = "allow"
uninlined_format_args = "allow"
useless_format = "allow"
unnecessary_map_or = "allow"
manual_div_ceil = "allow"
nonminimal_bool = "allow"
identity_op = "allow"
erasing_op = "allow"
cast_abs_to_unsigned = "allow"
needless_borrow = "allow"
needless_lifetimes = "allow"
large_enum_variant = "allow"
result_large_err = "allow"
