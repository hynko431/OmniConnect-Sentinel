[package]
name = "sentinel-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Core agent daemon for OmniConnect Sentinel: Userspace device interceptor, VFS coordinator, and threat mitigater"

[[bin]]
name = "sentinel-agent"
path = "src/main.rs"

[dependencies]
sentinel-proto.workspace = true
sentinel-cdr.workspace = true
sentinel-sys.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
aes-gcm.workspace = true
rand.workspace = true
hex = "0.4"
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true

# Cross-platform userspace I/O
walkdir = "2.5"
thiserror = "2.0"
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[features]
default = []
vfs-winfsp = []

[dev-dependencies]
tempfile = "3.10"
