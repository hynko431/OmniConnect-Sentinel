[package]
name = "sentinel-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for OmniConnect Sentinel (manual testing, file sanitization, and triage)"

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dependencies]
sentinel-cdr.workspace = true
sentinel-core.workspace = true
sentinel-proto.workspace = true
sentinel-sys.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
sha2.workspace = true
hex = "0.4"
uuid.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.6.20", default-features = false }
http = "0.2"
hyper = { version = "0.14", features = ["server", "http1", "tcp"] }
tower = "0.4"
subtle = "2.6"
