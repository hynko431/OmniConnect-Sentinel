[package]
name = "sentinel-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for OmniConnect Sentinel (manual testing, file sanitization, and triage)"

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dependencies]
sentinel-cdr.workspace = true
sentinel-core.workspace = true
sentinel-proto.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
